  usehooks-ts: ^3.1.1
  uuid: ^14.0.1
  zod: 4.4.3
  "zustand": ^5.0.15
  "@excalidraw/excalidraw": ^0.18.1
  "lodash": ^4.18.1
  "react-markdown": ^10.1.0
  "remark-gfm": ^4.0.1
