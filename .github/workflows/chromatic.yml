name: "Chromatic"

on:
  push:
    branches:
      - main
    paths:
      - "@acme/ui/**"
  pull_request:
    paths:
      - "@acme/ui/**"

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same setup as CI: pnpm from packageManager, Node from .nvmrc.
      - name: Setup
        uses: ./@acme/github/setup

      - name: Run Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: "@acme/ui"
          exitZeroOnChanges: true 
